<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Store-Bilder</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(1100px 700px at -10% -20%, #fff1e3 0%, transparent 60%), linear-gradient(135deg, #f8fafc 0%, #eef2f6 100%); }
  .stage.plain { background: radial-gradient(900px 600px at 50% -10%, #fff3e6 0%, transparent 65%), linear-gradient(180deg, #f6f8fb 0%, #e9eef4 100%); }

  /* Textspalte (nur Chrome-Screenshots) */
  .copy { position: absolute; left: 90px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; color: #475569; margin-bottom: 26px; }
  .brand img { width: 48px; height: 48px; }
  h1 { margin: 0 0 22px; font-size: 52px; line-height: 1.12; font-weight: 750; letter-spacing: -.02em; }
  .lead { margin: 0; font-size: 23px; line-height: 1.5; color: #334155; }
  .foot { margin-top: 34px; font-size: 15px; color: #94a3b8; }

  /* Popup im Rahmen */
  .popup { position: absolute; border-radius: 16px; overflow: hidden; background: #f6f7f9;
    box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 24px 60px -12px rgba(15,23,42,.28), 0 0 0 1px rgba(15,23,42,.08); }
  .popup img { display: block; width: 100%; }

  /* Hintergrund-Funktionen (Folie 5) */
  .toolbar { position: absolute; height: 52px; border-radius: 12px; background: #fff; display: flex; align-items: center; gap: 16px; padding: 0 16px;
    box-shadow: 0 0 0 1px rgba(15,23,42,.08), 0 12px 30px -10px rgba(15,23,42,.25); }
  .toolbar .bar { height: 30px; border-radius: 15px; background: #f1f5f9; flex: 1; display: flex; align-items: center; padding: 0 14px; color: #64748b; font-size: 14px; }
  .toolbar .ghost { width: 20px; height: 20px; border-radius: 5px; background: #e2e8f0; }
  .tbicon { position: relative; width: 30px; height: 30px; }
  .tbicon img { width: 26px; height: 26px; margin: 2px; }
  .badge { position: absolute; right: -9px; bottom: -6px; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 4px; background: #dc2626; color: #fff; font: 700 11px/16px Inter, sans-serif; text-align: center; }
  .note { position: absolute; width: 380px; border-radius: 12px; background: #fff; padding: 14px 16px; display: flex; gap: 12px;
    box-shadow: 0 0 0 1px rgba(15,23,42,.08), 0 16px 40px -12px rgba(15,23,42,.3); }
  .note img { width: 40px; height: 40px; flex: none; }
  .note .app { font-size: 12px; color: #64748b; margin-bottom: 2px; }
  .note b { display: block; font-size: 15px; }
  .note span { font-size: 14px; color: #334155; }
  .menu { position: absolute; width: 300px; border-radius: 10px; background: #fff; padding: 6px 0; font-size: 14px;
    box-shadow: 0 0 0 1px rgba(15,23,42,.1), 0 16px 40px -12px rgba(15,23,42,.3); }
  .menu div { padding: 7px 16px 7px 44px; color: #94a3b8; position: relative; }
  .menu hr { border: 0; border-top: 1px solid #e2e8f0; margin: 5px 0; }
  .menu .ext { color: #0f172a; }
  .menu .ext img { position: absolute; left: 14px; top: 8px; width: 18px; height: 18px; }
  .menu .ext.hl { background: #eff6ff; }
  .window { position: absolute; border-radius: 14px; overflow: hidden; background: #f6f7f9;
    box-shadow: 0 0 0 1px rgba(15,23,42,.08), 0 24px 60px -12px rgba(15,23,42,.28); }
  .window img { display: block; }
  .tag { position: absolute; font-size: 14px; font-weight: 600; color: #64748b; letter-spacing: .02em; }

  /* Promo-Kacheln */
  .promo { position: relative; width: 100%; height: 100%; overflow: hidden; color: #fff;
    background: radial-gradient(520px 380px at 0% 0%, #fdba74 0%, transparent 70%), linear-gradient(135deg, #fb923c 0%, #ea580c 100%); }
  .promo .logo { border-radius: 22%; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px -10px rgba(124,45,18,.6); }
  .promo h2 { margin: 0; font-weight: 750; letter-spacing: -.015em; line-height: 1.12; }
  .promo p { margin: 0; opacity: .95; }
</style>
</head>
<body>
<div id="root" style="width:100%;height:100%"></div>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const kind = q.get('kind');        // shot | promo | marquee
const store = q.get('store');      // chrome | firefox
const lang = q.get('lang') || 'en';
const n = Number(q.get('n') || 1);
const TAB = ['', 'overview', 'checks', 'dns', 'dyndns'];

const TEXT = {
  en: {
    foot: 'Unofficial add-on · demo data',
    tagline: 'Health checks · DNS64 · DynDNS',
    marquee: 'Your Node64 and ipv64.net right in the browser toolbar.',
    slides: [null,
      ['Your Node64 at a glance', 'Module status, failing checks, blocked DNS share, public IP and expiring certificates – one click away.'],
      ['Health checks in your toolbar', 'See every check with state and latency, run or pause it, and get a notification when something goes down.'],
      ['Control the DNS64 filter', 'Pause blocking, allow or block the site you are on, and unblock recently blocked domains with one click.'],
      ['DynDNS and public IP', 'Copy your public IPv4/IPv6, trigger DynDNS updates and see the domains in your ipv64.net account.'],
      ['Works in the background', 'A badge on the icon counts failing checks, notifications report outages, and the right-click menu allows or blocks any domain.'],
    ],
    tb: 'example.com', app: 'Node64 Browser Extension', down: 'Check down', menu: ['Back', 'Reload', 'Save page as…', 'Print…'],
    menuAllow: 'Allow domain in DNS64', menuDeny: 'Block domain in DNS64', check: 'Pi-hole DNS',
  },
  de: {
    foot: 'Inoffizielles Addon · Testdaten',
    tagline: 'Healthchecks · DNS64 · DynDNS',
    marquee: 'Deine Node64 und ipv64.net direkt in der Symbolleiste.',
    slides: [null,
      ['Deine Node64 auf einen Blick', 'Modulstatus, gestörte Checks, DNS-Blockquote, öffentliche IP und ablaufende Zertifikate – einen Klick entfernt.'],
      ['Healthchecks in der Symbolleiste', 'Jeder Check mit Status und Antwortzeit: direkt prüfen, pausieren und bei Ausfällen benachrichtigt werden.'],
      ['DNS64-Filter steuern', 'Blockieren pausieren, die offene Seite freigeben oder sperren und zuletzt blockierte Domains mit einem Klick erlauben.'],
      ['DynDNS und öffentliche IP', 'Öffentliche IPv4/IPv6 kopieren, DynDNS-Updates anstoßen und die Domains im ipv64.net-Konto sehen.'],
      ['Arbeitet im Hintergrund', 'Das Symbol zählt gestörte Checks, Benachrichtigungen melden Ausfälle und per Rechtsklick gibst du Domains frei oder sperrst sie.'],
    ],
    tb: 'example.com', app: 'Node64 Browser Extension', down: 'Check gestört', menu: ['Zurück', 'Neu laden', 'Seite speichern unter …', 'Drucken …'],
    menuAllow: 'Domain in DNS64 freigeben', menuDeny: 'Domain in DNS64 sperren', check: 'Pi-hole DNS',
  },
};
const T = TEXT[lang];
const root = document.getElementById('root');
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const ICON = 'icon-128.png';

function popup(tab, left, top, width) {
  return `<div class="popup" style="left:${left}px;top:50%;transform:translateY(-50%);width:${width}px"><img src="raw/popup-${lang}-${tab}.png"></div>`;
}

/** Folie 5: Symbol mit Zähler, Benachrichtigung, Rechtsklick-Menü, Einstellungen. x/y = Ursprung der Gruppe. */
function background(x, y, zoom) {
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:560px;height:460px;zoom:${zoom || 1}">
    <div class="toolbar" style="left:0;top:0;width:540px">
      <div class="ghost"></div><div class="ghost"></div>
      <div class="bar">${T.tb}</div>
      <div class="tbicon"><img src="${ICON}"><span class="badge">1</span></div>
      <div class="ghost"></div>
    </div>
    <div class="note" style="left:160px;top:76px">
      <img src="${ICON}"><div><div class="app">${T.app}</div><b>${T.down}</b><span>${T.check}</span></div>
    </div>
    <div class="menu" style="left:0;top:200px">
      ${T.menu.slice(0, 2).map((m) => `<div>${m}</div>`).join('')}<hr>
      ${T.menu.slice(2).map((m) => `<div>${m}</div>`).join('')}<hr>
      <div class="ext hl"><img src="${ICON}">${T.menuAllow}</div>
      <div class="ext"><img src="${ICON}">${T.menuDeny}</div>
    </div></div>`;
}
function settings(left, top, w, h) {
  // Einstellungsseite (Rohbild 640 CSS-px breit), auf w skaliert und unten abgeschnitten
  return `<div class="window" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
    <img src="raw/options-${lang}.png" style="width:${w}px"></div>`;
}

let html;
if (kind === 'promo') {
  html = `<div class="promo">
    <div class="logo" style="position:absolute;left:34px;top:44px;width:64px;height:64px"><img src="${ICON}" style="width:52px"></div>
    <h2 style="position:absolute;left:34px;top:128px;font-size:34px">Node64 Browser<br>Extension</h2>
    <p style="position:absolute;left:34px;top:216px;font-size:16px">${T.tagline}</p></div>`;
} else if (kind === 'marquee') {
  html = `<div class="promo">
    <div class="logo" style="position:absolute;left:110px;top:120px;width:96px;height:96px"><img src="${ICON}" style="width:78px"></div>
    <h2 style="position:absolute;left:110px;top:244px;font-size:58px">Node64 Browser Extension</h2>
    <p style="position:absolute;left:110px;top:330px;font-size:26px;width:560px;line-height:1.4">${T.marquee}</p>
    <div class="popup" style="left:930px;top:70px;width:400px"><img src="raw/popup-${lang}-overview.png"></div></div>`;
} else if (store === 'chrome') {
  const [title, lead] = T.slides[n];
  const copy = `<div class="copy"${n === 5 ? ' style="width:470px"' : ''}>
      <div class="brand"><img src="${ICON}">Node64 Browser Extension</div>
      <h1>${title}</h1><p class="lead">${lead}</p><div class="foot">${T.foot}</div></div>`;
  const art = n < 5 ? popup(TAB[n], 760, 52, 440) : background(540, 127, 1.12);
  html = `<div class="stage">${copy}${art}</div>`;
} else {
  // Firefox: Mozilla empfiehlt Screenshots ohne Text – nur die Oberfläche, Beschreibung in den Bildunterschriften.
  const art = n < 5 ? popup(TAB[n], 420, 40, 440) : background(70, 190, 1) + settings(700, 60, 500, 680);
  html = `<div class="stage plain">${art}</div>`;
}
root.innerHTML = html;
Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })))
  .then(() => document.fonts.ready).then(() => { document.documentElement.dataset.ready = '1'; });
</script>
</body>
</html>
