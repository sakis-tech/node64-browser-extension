# Legt einen GitHub-Release an, sobald src/manifest.json eine Version hat, für die es noch keinen
# Release gibt: baut die ZIPs mit .github/scripts/build.py, erstellt den Tag v<Version> und nimmt den
# passenden Abschnitt aus CHANGELOG.md als Text. Lädt die Version danach zu Firefox Add-ons und in den
# Chrome Web Store hoch.
# Läuft bei jedem Push auf main (oder von Hand). Von Hand mit Haken „chrome_upload“ lädt er die aktuelle
# Version auch dann in den Chrome Web Store, wenn es den Release schon gibt.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      chrome_upload:
        description: "Aktuelle Version in den Chrome Web Store hochladen, auch wenn es den Release schon gibt"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Gibt es den Release schon?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src/manifest.json'))['version'])")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon – nichts zu tun."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "^## $VERSION\b" CHANGELOG.md; then
            echo "::warning::Kein Abschnitt '## $VERSION' im CHANGELOG.md – kein Release angelegt."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ZIPs bauen
        if: steps.check.outputs.new == 'true' || inputs.chrome_upload
        run: python3 .github/scripts/build.py

      - name: Release-Text aus dem Changelog
        if: steps.check.outputs.new == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          python3 - <<'EOF'
          import os, re
          version = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(version) + r"\b.*?$\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else "Siehe CHANGELOG.md.") + """

          ### Installation

          - **Firefox:** am besten über [Firefox Add-ons](https://addons.mozilla.org/de/firefox/addon/node64-browser-extension/). Die ZIP unten lässt sich in Firefox nur vorübergehend laden (`about:debugging` → *Temporäres Add-on laden*).
          - **Chrome, Edge, Brave:** am besten über den [Chrome Web Store](https://chromewebstore.google.com/detail/node64-browser-extension/bjcjjbcpkmmfaaebjgoaiobjhakhoima). Ohne Store: `…-chrome.zip` herunterladen, entpacken, unter `chrome://extensions` den Entwicklermodus einschalten und *Entpackte Erweiterung laden* → entpackten Ordner wählen.

          Ausführlich im [README](https://github.com/sakis-tech/node64-browser-extension#installation).
          """
          open("notes.md", "w", encoding="utf-8").write("\n".join(l.removeprefix("          ") for l in notes.splitlines()) + "\n")
          # Versionshinweise für Firefox Add-ons (nur der Changelog-Abschnitt, ohne Links auf die ZIPs)
          import json
          amo = {"version": {"release_notes": {"de": m.group(1).strip() if m else "Siehe CHANGELOG.md auf GitHub."}}}
          open("amo.json", "w", encoding="utf-8").write(json.dumps(amo, ensure_ascii=False))
          EOF

      - name: Release anlegen
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

      # Lädt dist/firefox als neue, öffentlich gelistete Version zu Firefox Add-ons hoch.
      # Mozilla prüft sie danach noch; der Workflow wartet darauf nicht (approval-timeout 0).
      # Läuft nur, wenn die Secrets AMO_JWT_ISSUER und AMO_JWT_SECRET gesetzt sind.
      - name: Zu Firefox Add-ons hochladen
        if: steps.check.outputs.new == 'true' && env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: >-
          npx --yes web-ext@10 sign
          --source-dir dist/firefox
          --artifacts-dir web-ext-artifacts
          --channel listed
          --approval-timeout 0
          --amo-metadata amo.json
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"

      # Lädt die Chrome-ZIP in den Chrome Web Store hoch und reicht sie zur Prüfung ein
      # (.github/scripts/chrome_upload.py, Chrome Web Store API V2 mit Dienstkonto). Google prüft danach noch.
      # Läuft nur, wenn die Secrets CWS_SERVICE_ACCOUNT_JSON und CWS_PUBLISHER_ID gesetzt sind.
      - name: In den Chrome Web Store hochladen
        if: (steps.check.outputs.new == 'true' || inputs.chrome_upload) && env.CWS_SERVICE_ACCOUNT_JSON != '' && env.CWS_PUBLISHER_ID != ''
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          pip install --quiet google-auth requests
          python3 .github/scripts/chrome_upload.py "dist/node64-browser-extension-${TAG#v}-chrome.zip"
