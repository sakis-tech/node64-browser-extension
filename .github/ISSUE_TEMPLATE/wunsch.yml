name: Wunsch / Feature request
description: Idee für eine neue Funktion. / Idea for a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: wunsch
    attributes:
      label: Was wünschst du dir? / What would you like?
      description: Beschreibe kurz, was das Addon können soll und wofür du es brauchst. / Briefly describe what the add-on should do and why you need it.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome
        - Edge
        - Brave
        - Anderer / Other
